[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentless-ml"
version = "0.1.0.dev0"
description = "A modern multilingual Agentless baseline for software-engineering benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Youssef Mejdi" }]
dependencies = [
    "tree-sitter-rust>=0.24,<0.25",
    "libcst>=1.1,<2",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/josephsenior/Agentless-ML"
Issues = "https://github.com/josephsenior/Agentless-ML/issues"

[project.optional-dependencies]
benchmarks = ["pyarrow>=15"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
